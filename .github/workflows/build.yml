name: Create IPA Packages

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct URL to Decrypted Spotify IPA'
        required: true
      deb_url:
        description: 'Direct URL to EeveeSpotify .deb'
        required: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Azule
        run: |
          BUILDER_OWNER="mpelteshki"
          git clone "https://github.com/${BUILDER_OWNER}/Azule" ~/Azule
          sudo ln -sf ~/Azule/azule /usr/local/bin/azule

      - name: Download Files
        run: |
          wget --no-check-certificate "${{ github.event.inputs.ipa_url }}" -O input.ipa
          wget --no-check-certificate "${{ github.event.inputs.deb_url }}" -O tweak.deb

      - name: Inject Tweak
        run: |
          azule -i input.ipa -o "$PWD" -n output -f "$PWD/tweak.deb"

      - name: Upload Finished Build
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-Patched-IPA
          path: output.ipa

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" output.ipa \
            --target "${{ github.sha }}" \
            --title "EeveeSpotify Patched IPA (build ${{ github.run_number }})" \
            --notes ""
