name: Create IPA Packages

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct URL to Decrypted Spotify IPA'
        required: true
      deb_url:
        description: 'Direct URL to EeveeSpotify .deb'
        required: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Azule
        run: |
          git clone https://github.com/mpelteshki/Azule ~/Azule
          sudo ln -sf ~/Azule/azule /usr/local/bin/azule

            - name: Download Files
        run: |
          wget --no-check-certificate --user-agent="Mozilla/5.0" "${{ github.event.inputs.ipa_url }}" -O input.ipa
          wget --no-check-certificate --user-agent="Mozilla/5.0" "${{ github.event.inputs.deb_url }}" -O tweak.deb

      - name: Inject Tweak
        run: |
          azule -i input.ipa -o output.ipa -f tweak.deb

      - name: Upload Finished Build
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-Patched-IPA
          path: output.ipa
