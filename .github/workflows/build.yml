name: Create IPA Packages

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct URL to Decrypted Spotify IPA'
        required: true
      deb_url:
        description: 'Direct URL to EeveeSpotify .deb'
        required: true

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install dpkg ldid
          python3 -m pip install --upgrade --break-system-packages \
              git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download Files
        run: |
          wget --no-check-certificate "${{ github.event.inputs.ipa_url }}" -O input.ipa
          wget --no-check-certificate "${{ github.event.inputs.deb_url }}" -O tweak.deb

      - name: Inject Tweak (cyan)
        run: |
          DEB_EXTRACT="$RUNNER_TEMP/deb-extract"; mkdir -p "$DEB_EXTRACT"
          dpkg-deb -R tweak.deb "$DEB_EXTRACT"

          DYLIB_SRC=$(find "$DEB_EXTRACT" -name 'EeveeSpotify.dylib' | head -1)
          BUNDLE_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSpotify.bundle' | head -1)
          FRAMEWORK_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSwiftProtobuf.framework' | head -1)

          INJECT=("$DYLIB_SRC")
          [ -n "$FRAMEWORK_SRC" ] && INJECT+=("$FRAMEWORK_SRC")
          [ -n "$BUNDLE_SRC" ]    && INJECT+=("$BUNDLE_SRC")

          cyan -i input.ipa -o output.ipa \
               -f "${INJECT[@]}" -c 9 -m 15.0 -du

      - name: Upload Finished Build
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-Patched-IPA
          path: output.ipa

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" output.ipa \
            --target "${{ github.sha }}" \
            --title "EeveeSpotify Patched IPA (build ${{ github.run_number }})" \
            --notes ""
